name: Update visual baselines

# Screenshot hashes depend on the machine's fonts, so baselines are generated here, on the same
# runner image and setup as the "tests" workflow, and committed back to the chosen branch.
# Run it from the Actions tab after an intentional visual change.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate and commit baselines on
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate and commit baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate baselines
        run: UPDATE_VISUAL=1 node --test test/*.visual.e2e.test.js
      - name: Check the new baselines are stable (second run must match)
        run: node --test test/*.visual.e2e.test.js
      - name: Commit changed baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git add test/visual
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: regenerate visual baselines on the CI runner"
          git push origin "HEAD:${BRANCH}"
